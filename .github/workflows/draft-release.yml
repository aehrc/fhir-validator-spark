# This workflow:
# - Verifies that maven project version is a release version
# - Creates a draft release
# - Uploads the release to the Maven Central Portal, where it waits to be released by a person
# This is only run when a version tag is pushed.

name: Draft Release
on:
  push:
    tags:
      - "v**"

env:
  distribution: 'zulu'
  java-version: 21

jobs:
   draft-release:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up JDK ${{ env.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.java-version }}
          distribution: ${{ env.distribution }}
          cache: 'maven'
          cache-dependency-path: 'pom.xml'
      - name: Check if is a RELEASE version
        run: |
          if [[ $(mvn help:evaluate -Dexpression=project.version -q -DforceStdout) != *SNAPSHOT* ]]; then
              echo "Verified is a RELEASE version"
          else
              echo "Not a RELEASE version"
              exit 1
          fi            
      - name: Extract tag name
        id: extract_tag
        run: echo "TAG_NAME=$(echo ${GITHUB_REF#refs/tags/})" >> $GITHUB_ENV
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          draft: true
          prerelease: false

   publish-maven-central:
    name: Upload to Maven Central
    # The draft release job checks that the version is a release version.
    needs: draft-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK ${{ env.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.java-version }}
          distribution: ${{ env.distribution }}
          cache: 'maven'
          cache-dependency-path: 'pom.xml'
          # Writes a settings.xml with credentials for the server the release profile uploads to.
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
      - name: Upload to the Central Portal
        # The deployment is validated but not published: release it in the Central Portal.
        run: mvn -B deploy --file pom.xml -DskipTests -Prelease
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
